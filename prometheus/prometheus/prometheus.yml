global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ocas'

rule_files:
  - 'alert.rules'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '10.10.1.1:9100'
          - '10.10.1.2:9100'
          - '10.10.1.3:9100'
          - '10.10.1.4:9100'
          - '10.10.1.5:9100'
          - '10.10.1.6:9100'

  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '10.10.1.1:31080'
          - '10.10.1.2:31080'
          - '10.10.1.3:31080'
          - '10.10.1.4:31080'
          - '10.10.1.5:31080'
          - '10.10.1.6:31080'

  - job_name: 'docker-swarm'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.10.1.6:9323']